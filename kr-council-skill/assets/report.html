<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root {
  --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1d1f; --muted: #5f6368; --line: #dcd9d0;
  --accent: #1f5f8b; --warn-bg: #fff4d6; --warn-ink: #6b4a00; --note-bg: #e8f1f8;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #17181a; --panel: #202225; --ink: #ececec; --muted: #a0a4a8; --line: #34373b;
          --accent: #7fb8e0; --warn-bg: #3a2f10; --warn-ink: #f0d58a; --note-bg: #1f2e3a; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); line-height: 1.65;
  font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
main { max-width: 1080px; margin: 0 auto; padding: 24px 16px 64px; }
h1 { font-size: 1.6rem; margin: 0 0 4px; }
h2 { font-size: 1.2rem; margin: 36px 0 12px; border-bottom: 2px solid var(--accent); padding-bottom: 6px; }
h3 { font-size: 1.05rem; margin: 0 0 6px; color: var(--accent); }
.meta { color: var(--muted); font-size: .9rem; margin-bottom: 16px; }
.banner { padding: 10px 14px; border-radius: 8px; background: var(--note-bg); margin-bottom: 8px; }
.disclaimer { padding: 10px 14px; border-radius: 8px; background: var(--warn-bg); color: var(--warn-ink); font-size: .92rem; }
.question { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; white-space: pre-wrap; }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.advisor-card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.advisor-card .position { font-weight: 700; margin: 0 0 8px; }
.advisor-card ol { margin: 0 0 8px; padding-left: 20px; }
.advisor-card p { margin: 6px 0; }
.label { color: var(--muted); font-size: .85rem; font-weight: 700; margin-right: 4px; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; background: var(--panel); font-size: .92rem; }
th, td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
th { background: var(--note-bg); }
.verdict { background: var(--panel); border: 2px solid var(--accent); border-radius: 12px; padding: 18px 20px; }
.verdict h3 { margin-top: 18px; }
.verdict h3:first-child { margin-top: 0; }
.verdict ul { margin: 6px 0; padding-left: 20px; }
.rec { font-size: 1.05rem; font-weight: 700; }
.first { background: var(--note-bg); border-radius: 8px; padding: 10px 14px; font-weight: 700; }
.chips span { display: inline-block; margin: 0 8px 6px 0; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); font-size: .88rem; }
@media print { body { background: #fff; color: #000; } .advisor-card, .verdict, table { break-inside: avoid; } }
</style>
</head>
<body>
<main>
  <h1>{{TITLE}}</h1>
  <div class="meta">{{CREATED}}</div>
  <div class="banner">{{MODE_BANNER}}</div>
  <div class="disclaimer">{{DISCLAIMER}}</div>

  <h2>질문</h2>
  <div class="question">{{QUESTION}}</div>

  <h2>위원 5명의 판단</h2>
  <div class="grid">
{{ADVISOR_CARDS}}
  </div>

  <h2>상호 검토 결과</h2>
  <div class="table-wrap">
{{REVIEW_TABLE}}
  </div>

  <h2>{{CHAIR_NAME}}(위원장)의 최종 검토 보고서</h2>
  <div class="verdict">
{{VERDICT}}
  </div>
</main>
</body>
</html>
