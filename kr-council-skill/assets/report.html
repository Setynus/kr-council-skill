<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root {
  --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1d1f; --muted: #5f6368; --line: #dcd9d0;
  --accent: #1f5f8b; --warn-bg: #fff4d6; --warn-ink: #6b4a00; --note-bg: #e8f1f8; --crit: #b3261e;
  --shadow: rgba(0, 0, 0, .14);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17181a; --panel: #202225; --ink: #ececec; --muted: #a0a4a8; --line: #34373b;
    --accent: #7fb8e0; --warn-bg: #3a2f10; --warn-ink: #f0d58a; --note-bg: #1f2e3a; --crit: #f2a09a;
    --shadow: rgba(0, 0, 0, .5);
  }
}
:root[data-theme="dark"] {
  --bg: #17181a; --panel: #202225; --ink: #ececec; --muted: #a0a4a8; --line: #34373b;
  --accent: #7fb8e0; --warn-bg: #3a2f10; --warn-ink: #f0d58a; --note-bg: #1f2e3a; --crit: #f2a09a;
  --shadow: rgba(0, 0, 0, .5);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); line-height: 1.65; overflow-wrap: anywhere;
  font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
main { max-width: 1080px; margin: 0 auto; padding: 24px 16px 64px; }
section { scroll-margin-top: 104px; }
h1 { font-size: 1.6rem; margin: 0 0 4px; }
h2 { font-size: 1.2rem; margin: 36px 0 12px; border-bottom: 2px solid var(--accent); padding-bottom: 6px; }
h3 { font-size: 1.05rem; margin: 0 0 6px; color: var(--accent); }
a:focus-visible, button:focus-visible, .node:focus-visible, .advisor-card:focus-visible {
  outline: 3px solid var(--accent); outline-offset: 2px; }

/* 스티키 헤더 */
.site-header { position: sticky; top: 0; z-index: 10; background: var(--panel); border-bottom: 1px solid var(--line); }
.site-header-inner { max-width: 1080px; margin: 0 auto; padding: 8px 16px; display: flex; flex-wrap: wrap;
  align-items: center; gap: 6px 20px; }
.site-name { font-weight: 700; color: var(--accent); text-decoration: none; }
.site-header nav { display: flex; flex-wrap: wrap; gap: 2px 14px; flex: 1 1 auto; }
.site-header nav a { color: var(--ink); text-decoration: none; font-size: .92rem; padding: 2px 4px; }
.site-header nav a:hover { color: var(--accent); text-decoration: underline; }
.btn { font: inherit; font-size: .88rem; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
  border-radius: 8px; padding: 4px 12px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn[aria-pressed="true"] { background: var(--accent); color: var(--panel); border-color: var(--accent); }
.js-only { display: none; }
.js .header-actions, .js .hero-tabs { display: flex; gap: 8px; }

.meta { color: var(--muted); font-size: .9rem; margin-bottom: 16px; }
.banner { padding: 10px 14px; border-radius: 8px; background: var(--note-bg); margin-bottom: 8px; }
.disclaimer { padding: 10px 14px; border-radius: 8px; background: var(--warn-bg); color: var(--warn-ink); font-size: .92rem; }
.question { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; white-space: pre-wrap; }

/* 위원장 카드(가장 큼) */
.verdict { background: var(--panel); border: 2px solid var(--accent); border-radius: 12px; padding: 18px 20px; }
.hero { padding: 24px 26px; margin-top: 28px; border-width: 3px; }
.hero > h2 { margin-top: 0; font-size: 1.45rem; }
.verdict h3 { margin-top: 18px; }
.verdict ul { margin: 6px 0; padding-left: 20px; }
.rec { font-size: 1.05rem; font-weight: 700; }
.first { background: var(--note-bg); border-radius: 8px; padding: 10px 14px; font-weight: 700; }
.chips span { display: inline-block; margin: 0 8px 6px 0; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); font-size: .88rem; }
.hero-tabs { margin: 0 0 14px; }
/* JS가 있을 때만 전환: 위원장 보고서 ↔ 위원 판단(선택된 위원 1명) */
.js .hero:not([data-view="advisors"]) .pane-advisors { display: none; }
.js .hero[data-view="advisors"] .pane-report { display: none; }
.js .pane-advisors .advisor-card { display: none; }
.js .pane-advisors .advisor-card.is-active { display: block; }
.js .pane-advisors .grid { grid-template-columns: 1fr; }
.pane-advisors > h3 { margin-top: 0; }

.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.advisor-card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.advisor-card .position { font-weight: 700; margin: 0 0 8px; }
.advisor-card ol { margin: 0 0 8px; padding-left: 20px; }
.advisor-card p { margin: 6px 0; }
.label { color: var(--muted); font-size: .85rem; font-weight: 700; margin-right: 4px; }

/* 위원 소형 카드 */
.mini-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.advisor-mini { display: block; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: 12px 14px; color: inherit; text-decoration: none; }
.advisor-mini strong { display: block; color: var(--accent); }
.advisor-mini span { display: block; font-size: .88rem; color: var(--muted); }
.advisor-mini.is-selected { border-color: var(--accent); border-width: 2px; padding: 11px 13px; }
.advisor-mini, .hero { transition: transform .15s ease, box-shadow .15s ease; }
.advisor-mini:hover, .advisor-mini:focus-visible, .hero:hover { transform: translateY(-2px); box-shadow: 0 6px 16px var(--shadow); }

/* 상성 지도 */
.affinity-wrap svg { width: 100%; height: auto; display: block; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
.affinity-wrap .node circle { fill: var(--accent); }
.affinity-wrap .node text { fill: var(--ink); font-size: 14px; font-weight: 700; }
.edge { transition: opacity .15s ease; }
.edge.support { stroke: var(--accent); }
.edge.critique { stroke: var(--crit); }
.affinity-wrap.focus .edge:not(.is-related) { opacity: .15; }
.arrow.support path { fill: var(--accent); }
.arrow.critique path { fill: var(--crit); }
.legend { list-style: none; margin: 10px 0 4px; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: .9rem; }
.swatch { display: inline-block; width: 28px; vertical-align: middle; margin-right: 6px; border-top: 2px solid var(--accent); }
.swatch.critique { border-top: 2px dashed var(--crit); }
.swatch.mutual { border-top: 4px solid var(--accent); }
.legend-note { margin: 0; color: var(--muted); font-size: .85rem; }

.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; background: var(--panel); font-size: .92rem; }
th, td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
th { background: var(--note-bg); }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .advisor-mini, .hero, .edge { transition: none; }
  .advisor-mini:hover, .advisor-mini:focus-visible, .hero:hover { transform: none; }
}

/* 인쇄: 밝은 테마 고정, 헤더·버튼·소형 카드 숨김, 위원 상세와 검토 표를 모두 펼친다 */
@media print {
  :root, :root[data-theme], :root:not([data-theme="light"]) {
    --bg: #ffffff; --panel: #ffffff; --ink: #000000; --muted: #444444; --line: #bbbbbb;
    --accent: #1f5f8b; --warn-bg: #fff4d6; --warn-ink: #6b4a00; --note-bg: #e8f1f8; --crit: #b3261e;
    --shadow: transparent;
  }
  body { background: #fff; color: #000; }
  .site-header, .js-only, #advisors { display: none !important; }
  .js .hero .pane { display: block !important; }
  .js .pane-advisors .advisor-card { display: block !important; }
  .js .pane-advisors .grid { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
  .hero { transform: none !important; box-shadow: none !important; }
  .advisor-card, .verdict, table, .affinity-wrap { break-inside: avoid; }
}
</style>
</head>
<body id="top">
<script>
(function () {
  var root = document.documentElement;
  var KEY = 'kr-council-theme';
  root.classList.add('js');

  function storedTheme() {
    try { var v = localStorage.getItem(KEY); return v === 'light' || v === 'dark' ? v : null; } catch (e) { return null; }
  }
  function saveTheme(v) { try { localStorage.setItem(KEY, v); } catch (e) { /* 저장소를 못 써도 표시는 정상이다 */ } }
  function media(query) { return !!(window.matchMedia && window.matchMedia(query).matches); }

  var saved = storedTheme();
  if (saved) { root.setAttribute('data-theme', saved); }

  function init() {
    var all = function (selector) { return Array.prototype.slice.call(document.querySelectorAll(selector)); };
    var hero = document.getElementById('report');
    var cards = all('.advisor-card');
    var minis = all('.advisor-mini');
    var tabs = all('.hero-tabs button');
    var current = null;

    function setView(view) {
      if (!hero) { return; }
      hero.setAttribute('data-view', view);
      tabs.forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-show') === view)); });
    }
    function select(id) {
      current = id;
      cards.forEach(function (c) { c.classList.toggle('is-active', c.getAttribute('data-advisor') === id); });
      minis.forEach(function (m) {
        if (m.getAttribute('data-advisor') === id) { m.setAttribute('aria-current', 'true'); m.classList.add('is-selected'); }
        else { m.removeAttribute('aria-current'); m.classList.remove('is-selected'); }
      });
    }
    setView('report');

    minis.forEach(function (m) {
      m.addEventListener('click', function (event) {
        event.preventDefault();
        var id = m.getAttribute('data-advisor');
        select(id);
        setView('advisors');
        if (hero) { hero.scrollIntoView({ behavior: media('(prefers-reduced-motion: reduce)') ? 'auto' : 'smooth', block: 'start' }); }
        var card = document.getElementById('advisor-' + id);
        if (card) { card.setAttribute('tabindex', '-1'); card.focus({ preventScroll: true }); }
      });
    });
    tabs.forEach(function (b) {
      b.addEventListener('click', function () {
        var view = b.getAttribute('data-show');
        if (view === 'advisors' && !current && cards.length) { select(cards[0].getAttribute('data-advisor')); }
        setView(view);
      });
    });

    var themeButton = document.getElementById('theme-toggle');
    function currentTheme() { return root.getAttribute('data-theme') || (media('(prefers-color-scheme: dark)') ? 'dark' : 'light'); }
    function syncThemeButton() { if (themeButton) { themeButton.setAttribute('aria-pressed', String(currentTheme() === 'dark')); } }
    if (themeButton) {
      themeButton.addEventListener('click', function () {
        var next = currentTheme() === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        saveTheme(next);
        syncThemeButton();
      });
    }
    syncThemeButton();

    var printButton = document.getElementById('print-btn');
    if (printButton) { printButton.addEventListener('click', function () { window.print(); }); }

    var map = document.querySelector('.affinity-wrap');
    var edges = all('.edge');
    function focusNode(id) {
      if (!map) { return; }
      map.classList.toggle('focus', !!id);
      edges.forEach(function (e) {
        e.classList.toggle('is-related', !!id && (e.getAttribute('data-from') === id || e.getAttribute('data-to') === id));
      });
    }
    all('.node').forEach(function (n) {
      var id = n.getAttribute('data-advisor');
      n.addEventListener('mouseenter', function () { focusNode(id); });
      n.addEventListener('focus', function () { focusNode(id); });
      n.addEventListener('mouseleave', function () { focusNode(null); });
      n.addEventListener('blur', function () { focusNode(null); });
    });
  }

  if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', init); } else { init(); }
})();
</script>
<header class="site-header">
  <div class="site-header-inner">
    <a class="site-name" href="#top">kr-council-skill</a>
    <nav aria-label="보고서 바로가기">
      <a href="#question">질문</a>
      <a href="#report">최종 보고서</a>
      <a href="#advisors">위원</a>
      <a href="#affinity">상성 지도</a>
      <a href="#reviews">검토 표</a>
    </nav>
    <div class="header-actions js-only">
      <button type="button" class="btn" id="theme-toggle" aria-pressed="false">다크 모드</button>
      <button type="button" class="btn" id="print-btn">인쇄</button>
    </div>
  </div>
</header>
<main>
  <h1>{{TITLE}}</h1>
  <div class="meta">{{CREATED}}</div>
  <div class="banner">{{MODE_BANNER}}</div>
  <div class="disclaimer">{{DISCLAIMER}}</div>

  <section id="question">
    <h2>질문</h2>
    <div class="question">{{QUESTION}}</div>
  </section>

  <section class="verdict hero" id="report">
    <h2>{{CHAIR_NAME}}(위원장)의 최종 검토 보고서</h2>
    <div class="hero-tabs js-only" role="group" aria-label="보기 전환">
      <button type="button" class="btn" data-show="report" aria-pressed="true">위원장 보고서</button>
      <button type="button" class="btn" data-show="advisors" aria-pressed="false">위원 판단</button>
    </div>
    <div class="pane pane-report" data-pane="report">
{{VERDICT}}
    </div>
    <div class="pane pane-advisors" data-pane="advisors">
      <h3>위원 5명의 판단</h3>
      <div class="grid">
{{ADVISOR_CARDS}}
      </div>
    </div>
  </section>

  <section id="advisors">
    <h2>위원 5명</h2>
    <div class="mini-grid">
{{MINI_CARDS}}
    </div>
  </section>

  <section id="affinity">
    <h2>상성 지도</h2>
{{AFFINITY_MAP}}
  </section>

  <section id="reviews">
    <h2>상호 검토 결과</h2>
    <div class="table-wrap">
{{REVIEW_TABLE}}
    </div>
  </section>
</main>
</body>
</html>
